name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.7.0)'
        required: true
        default: 'v1.7.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v', ''
          $notes = "Release Haven $ver"
          if (Test-Path CHANGELOG.md) {
            $ch = Get-Content CHANGELOG.md -Raw
            if ($ch -match "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n## \[|\z)") {
              $notes = $Matches[1].Trim()
            }
          }
          gh release create $env:TAG `
            "dist/Haven-Setup-$ver.exe" `
            "dist/Haven-Setup-$ver.exe.blockmap" `
            "dist/Haven-Portable-$ver.exe" `
            "dist/latest.yml" `
            --title "Haven $ver" `
            --notes $notes
