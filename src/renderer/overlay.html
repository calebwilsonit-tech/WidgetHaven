<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Haven guides</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
    :root { --c: #8b5cf6; }
    .zone { position: absolute; border-radius: 14px; border: 2px dashed rgba(255,255,255,.55); background: rgba(20,20,30,.18);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); transition: background .12s, border-color .12s; display: grid; place-items: center;
      font: 600 15px "Segoe UI Variable Display", "Segoe UI", sans-serif; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px #000; }
    .zone.on { background: color-mix(in srgb, var(--c) 38%, transparent); border: 2px solid var(--c); color: #fff; }
    .g { position: absolute; background: var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 8px var(--c); }
    .g.v { width: 2px; margin-left: -1px; }
    .g.h { height: 2px; margin-top: -1px; }
    .g.center { background: #f472b6; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 8px #f472b6; }
    .gap { position: absolute; background: color-mix(in srgb, var(--c) 30%, transparent); border: 1px dashed var(--c); }
    .pill { position: absolute; transform: translate(-50%, -50%); padding: 1px 6px; border-radius: 6px; background: var(--c); color: #fff;
      font: 600 11px "Segoe UI", sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.4); white-space: nowrap; }
    .hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 14px; border-radius: 10px;
      background: rgba(16,16,24,.85); color: #fff; font: 13px "Segoe UI", sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="overlay.js"></script>
</body>
</html>
