<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' haven: data: file:; font-src 'self' haven: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Haven Studio widget</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    /* Almost-invisible fill so the whole widget is grabbable, not just the glyph pixels. */
    body { background: rgba(0, 0, 0, .004); }
    #host { display: inline-block; padding: 14px; }
    body.editing #host .hs-root { outline: 1.5px dashed rgba(255, 255, 255, .55); outline-offset: 6px; }
    body.locked { cursor: default; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="studio-core.js"></script>
  <script src="studio.js"></script>
</body>
</html>
