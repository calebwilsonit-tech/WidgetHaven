<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' haven: https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' haven:" />
  <title>Haven</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="titlebar">
      <div class="brand">
        <div class="logo"><i></i><i></i><i></i><i></i></div>
        <span>Haven</span>
      </div>
      <div class="search" id="searchWrap">
        <svg class="ico"><use href="#i-search" /></svg>
        <input id="search" type="text" placeholder="Search apps, games, files…  or try  =12*8  ·  g cats" spellcheck="false" autocomplete="off" />
        <kbd id="hotkeyHint"></kbd>
      </div>
      <div class="titlebar-right">
        <div class="clock" id="clock"><b></b><span></span></div>
        <button class="tb studio-btn" id="btnStudio" title="Haven Studio: widgets, HavenBar, HavenTile, themes and live wallpaper"><svg class="ico"><use href="#i-sparkle" /></svg><span>Studio</span></button>
        <button class="tb" id="btnWidgets" title="Desktop widgets — split tabs onto your desktop"><svg class="ico"><use href="#i-layers" /></svg></button>
        <button class="tb" id="btnPin" title="Always on top"><svg class="ico"><use href="#i-pin" /></svg></button>
        <button class="tb" id="btnSettings" title="Settings (Ctrl+,)"><svg class="ico"><use href="#i-gear" /></svg></button>
        <button class="tb" id="btnMin" title="Minimize"><svg class="ico"><use href="#i-min" /></svg></button>
        <button class="tb close" id="btnClose" title="Close to tray"><svg class="ico"><use href="#i-x" /></svg></button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content" id="content" tabindex="-1"></main>

    <footer class="statusbar" id="statusbar"></footer>

    <div class="dropzone" id="dropzone"><div><svg class="ico big"><use href="#i-plus" /></svg><b>Drop to add</b><span id="dropTarget"></span></div></div>
  </div>

  <div class="menu" id="menu" hidden></div>
  <div class="modal-back" id="modalBack" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" /></symbol>
      <symbol id="i-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" /><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" /></symbol>
      <symbol id="i-game" viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 4 4.5l-.6 4A3 3 0 0 1 16.5 18L15 16H9l-1.5 2a3 3 0 0 1-4.9-1.5l-.6-4A4 4 0 0 1 6 8z" /><path d="M7.5 11v3M6 12.5h3" /><circle cx="16" cy="11.5" r=".6" /><circle cx="17.5" cy="13.5" r=".6" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z" /><path d="M14 3v5h5M9 13h6M9 17h4" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h10l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" /><path d="M8 10h8M8 14h8M8 18h5" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 4 4H6l4-4zM12 13v8" /></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4" /></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6" /></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4" /></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" /><circle cx="12" cy="12" r="1.3" /><circle cx="19" cy="12" r="1.3" /></symbol>
      <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" /></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="10" rx="2" /><rect x="13" y="3" width="8" height="6" rx="2" /><rect x="13" y="11" width="8" height="10" rx="2" /><rect x="3" y="15" width="8" height="6" rx="2" /></symbol>
      <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" /></symbol>
    </defs>
  </svg>
  <script src="app.js"></script>
</body>
</html>
