<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' haven: file: data:; font-src 'self' haven: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Haven launcher</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    :root { --base: #1e1e2e; --text: #cdd6f4; --subtext: #a6adc8; --accent: #cba6f7; --accent2: #89b4fa; --surface: #313244; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { padding: 18px; font: 14px/1.4 var(--font, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif); color: var(--text); user-select: none; -webkit-font-smoothing: antialiased; }
    .box {
      border-radius: var(--lr, 22px); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 36px);
      background: linear-gradient(160deg, rgb(var(--surface-rgb) / .6), rgb(var(--base-rgb) / .97) 40%), rgb(var(--base-rgb));
      box-shadow: 0 24px 60px rgb(0 0 0 / .5), 0 0 0 1px rgb(var(--text-rgb) / .1), inset 0 1px 0 rgb(255 255 255 / .06);
      opacity: 0; transform: translateY(-10px) scale(.96); transition: opacity .14s ease, transform .22s cubic-bezier(.2, .9, .3, 1.25);
    }
    .box.in { opacity: 1; transform: none; }
    .box.out { opacity: 0; transform: scale(.97); transition: opacity .1s, transform .1s; }
    .q { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgb(var(--text-rgb) / .08); }
    .q svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
    .q input { flex: 1; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 19px; }
    .q input::placeholder { color: var(--subtext); opacity: .7; }
    .q kbd { font: 11px var(--font); color: var(--subtext); padding: 3px 7px; border-radius: 6px; background: rgb(var(--text-rgb) / .08); }
    .list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .list::-webkit-scrollbar { width: 8px; } .list::-webkit-scrollbar-thumb { background: rgb(var(--text-rgb) / .14); border-radius: 8px; }
    .it { display: flex; align-items: center; gap: 13px; padding: 9px 12px; border-radius: 13px; animation: in .22s cubic-bezier(.2, .9, .3, 1.15) both; }
    .it img, .it .lt { width: 32px; height: 32px; flex: none; border-radius: 8px; }
    .it .lt { display: grid; place-items: center; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--base); }
    .it .t { flex: 1; min-width: 0; }
    .it b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .it span { display: block; font-size: 12px; color: var(--subtext); }
    .it mark { background: none; color: var(--accent); }
    .it.on { background: linear-gradient(90deg, rgb(var(--accent-rgb) / .24), rgb(var(--accent2-rgb) / .12)); box-shadow: inset 3px 0 0 var(--accent); }
    .it .go { opacity: 0; font-size: 12px; color: var(--subtext); }
    .it.on .go { opacity: 1; }
    .empty { padding: 28px; text-align: center; color: var(--subtext); }
    .foot { display: flex; gap: 14px; padding: 9px 18px; font-size: 11.5px; color: var(--subtext); border-top: 1px solid rgb(var(--text-rgb) / .06); }
    .foot kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: rgb(var(--text-rgb) / .08); }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    body.square .box, body.square .box * { border-radius: 2px !important; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search apps, games, files…" spellcheck="false" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="list" id="list"></div>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
